  <rect x="24" y="178" width="342" height="316" rx="24" class="card"/>
  <circle cx="195" cy="335" r="142.5" fill="#fff" fill-opacity=".05" class="line"/>
  <path d="M266.25 458.4A142.5 142.5 0 0 1 195 477.5L195 422.4A87.4 87.4 0 0 0 238.7 410.7Z" fill="#ffcf9e" fill-opacity=".24" stroke="#ffcf9e" stroke-opacity=".6"/>
  <circle cx="195" cy="335" r="87.4" class="line"/>
  <path class="line" d="M195 192.5V247.6M266.25 211.6L238.7 259.3M318.4 263.75L270.7 291.3M337.5 335H282.4M318.4 406.25L270.7 378.7M266.25 458.4L238.7 410.7M195 477.5V422.4M123.75 458.4L151.3 410.7M71.6 406.25L119.3 378.7M52.5 335H107.6M71.6 263.75L119.3 291.3M123.75 211.6L151.3 259.3"/>

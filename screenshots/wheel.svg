    <circle cx="195" cy="335" r="81.7" stroke="#e9c46a" stroke-opacity=".6" transform="rotate(-90 195 335)"/>
    <circle cx="195" cy="335" r="81.7" stroke="#b9a8ff" stroke-opacity=".6" transform="rotate(-60 195 335)"/>
    <circle cx="195" cy="335" r="81.7" stroke="#a99bff" stroke-opacity=".6" transform="rotate(-30 195 335)"/>

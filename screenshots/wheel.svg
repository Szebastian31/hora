  <rect x="224" y="134" width="70" height="32" rx="12" class="card"/><text x="259" y="154" text-anchor="middle" font-size="12.5" font-weight="600">Chinese</text>
  <rect x="300" y="134" width="96" height="32" rx="12" class="card"/><text x="312" y="154" font-size="12.5" font-weight="600">Numerology</text>


    <circle cx="195" cy="335" r="81.7" stroke="#a99bff" stroke-opacity=".6" transform="rotate(90 195 335)"/>
    <circle cx="195" cy="335" r="81.7" stroke="#ff9a78" stroke-opacity=".6" transform="rotate(120 195 335)"/>

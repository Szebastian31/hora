    <text x="226.5" y="217.5">Snow Goose</text><text x="281" y="249">Otter</text><text x="312.5" y="303.5">Cougar</text>
    <text x="312.5" y="366.5">Red Hawk</text><text x="281" y="421">Beaver</text><text x="226.5" y="452.5" font-size="10.5" font-weight="800" class="g2">Deer</text>
    <text x="163.5" y="452.5">Flicker</text><text x="109" y="421">Sturgeon</text><text x="77.5" y="366.5">Brown Bear</text>
    <text x="77.5" y="303.5">Raven</text><text x="109" y="249">Snake</text><text x="163.5" y="217.5">Elk</text>
  </g>
  <path class="line" d="M195 268V402M128 335H262"/><circle cx="195" cy="335" r="21" class="line"/>
  <g text-anchor="middle" font-weight="700" font-size="14">
    <text x="195" y="286" class="f">N</text><text x="244" y="335" class="g">E</text><text x="195" y="384" class="f">S</text><text x="146" y="335" class="f">W</text>
  </g>
  <g text-anchor="middle" font-size="6.5" class="f"><text x="195" y="297">Waboose</text><text x="244" y="346">Wabun</text><text x="195" y="395">Shawnodese</text><text x="146" y="346">Mudjekeewis</text></g>
  <text x="195" y="484" text-anchor="middle" font-size="10" class="f">Your moon of the wheel glows</text>

  <!-- totem card -->
  <rect x="24" y="506" width="342" height="230" rx="24" class="card"/>
  <text x="40" y="532" class="k">YOUR BIRTH TOTEM</text>
  <text x="40" y="562" font-size="24" font-weight="800" letter-spacing="-.6">Deer</text>
  <text x="40" y="582" font-size="12" class="d">Cornplanting Moon · 21 May – 20 Jun</text>
  <g font-size="15" class="s">
    <text x="40" y="608">Gentle, quick and sociable. You sense</text>
    <text x="40" y="628">danger and opportunity early, love good</text>
    <text x="40" y="648">conversation and move gracefully</text>
    <text x="40" y="668">between people.</text>
  </g>
  <rect x="40" y="682" width="98" height="44" rx="14" fill="#fff" fill-opacity=".14"/>
  <rect x="146" y="682" width="98" height="44" rx="14" fill="#fff" fill-opacity=".14"/>
  <rect x="252" y="682" width="98" height="44" rx="14" fill="#fff" fill-opacity=".14"/>
  <g text-anchor="middle"><text x="89" y="698" font-size="8.5" font-weight="700" letter-spacing="1" class="f">PLANT</text><text x="89" y="715" font-size="12.5" font-weight="700">Yarrow</text>
    <text x="195" y="698" font-size="8.5" font-weight="700" letter-spacing="1" class="f">MINERAL</text><text x="195" y="715" font-size="12.5" font-weight="700">Moss agate</text>
    <text x="301" y="698" font-size="8.5" font-weight="700" letter-spacing="1" class="f">COLOUR</text><text x="307" y="715" font-size="12.5" font-weight="700">White, green</text></g>
  <circle cx="262" cy="711" r="4.5" fill="#9fd3a5"/>

  <!-- tab bar -->
  <rect x="12" y="748" width="366" height="84" fill="#120a2e" fill-opacity=".78"/><path d="M12 748.5H378" class="line"/>
  <rect x="214.75" y="760" width="52" height="34" rx="12" class="card"/>
  <g class="ic" stroke-opacity=".5"><circle cx="57.75" cy="777" r="4"/><path d="M57.75 767.5v2M57.75 784.5v2M48.25 777h2M65.25 777h2"/>
    <path d="M149.25 767l1.9 5.6h6.1l-4.9 3.6 1.9 5.8-5-3.6-5 3.6 1.9-5.8-4.9-3.6h6.1z"/><circle cx="332.25" cy="773" r="4"/><path d="M324.25 786c1.5-4 4.5-6 8-6s6.5 2 8 6"/></g>
  <g class="ic"><circle cx="240.75" cy="777" r="9"/><circle cx="240.75" cy="777" r="4.5"/></g>
  <g font-size="10.5" font-weight="600" text-anchor="middle"><text x="57.75" y="807" class="f">Today</text><text x="149.25" y="807" class="f">Me</text><text x="240.75" y="807">Systems</text><text x="332.25" y="807" class="f">Profile</text></g>
  <circle cx="240.75" cy="815" r="2" fill="#ffcf9e"/>
</g>
<rect x="136" y="22" width="118" height="34" rx="17" fill="#000"/>

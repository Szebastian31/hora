<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 900" width="430" height="900" font-family="ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
